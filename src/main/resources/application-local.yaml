#
# Local environment = everything on the local machine
#

# Static resources are edited while the app is running, so the browser must never keep a
# copy: an edited stylesheet has to be the one that renders on the next request.
spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  thymeleaf:
    cache: false
  jackson:
    serialization:
      indent-output: true
# To read secrets (e.g. Claude API key)
  config:
    import: "optional:file:${folder.local}/config/secrets.properties"

BaseWebProcessor:
  siteName: "β-Going offgrid"

folder:
  local: "/Users/pierrecote/Working/offgrid"

server:
  port: 8080
  publicProtocol: "http"
  publicHostName: "localhost"
  publicPort: 8080
# The reason on a thrown ResponseStatusException reaches error.html. Boot drops it otherwise.
  error:
    include-message: always
