#
# Default configuration, for configurations that are profile dependent
#

BaseWebProcessor:
  siteName: "Going offgrid"
  welcomeMessage: "Going offgrid"
  administratorEmail: "Pierre@LogicielCote.COM"
  siteVersion: "0.1.0"

# The MCP server. protocol has to be stated even though STREAMABLE is the properties class's
# own default: the condition that installs the transport reads the environment, and an absent
# property means no transport and a 404 on /mcp. The endpoint stays the default /mcp.
# instructions is what a client reads before it decides which tool to call.
spring:
  application:
    name: offgrid
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: "offgrid"
        version: "0.1.0"
        instructions: "Going offgrid knows the campgrounds, rec sites and lakes of Vancouver
          Island, how rough the road in to each one is, and what the van and the Bronco are
          due for."

server:
  shutdown: immediate
