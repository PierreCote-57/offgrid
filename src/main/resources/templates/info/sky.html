<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="~{fragments/site/header}"></div>

<main>
	<h1 th:text="${PageName}">The sky above you</h1>

	<p>
		This is the sky above you.
	</p>

	<div th:replace="~{fragments/block/sky-fragment :: datePicker}"></div>

	<div class="og-sky-row">
		<div th:replace="~{fragments/block/sky-fragment :: chart(430)}"></div>
		<div th:replace="~{fragments/block/sky-fragment :: table}"></div>
	</div>

	<p>
		And this is text below the sky
	</p>

	<details class="og-sky-wide">
		<summary>The chart, full width</summary>
		<div th:replace="~{fragments/block/sky-fragment :: chart(950)}"></div>
	</details>
</main>

<div th:replace="~{fragments/site/footer}"></div>
</html>
