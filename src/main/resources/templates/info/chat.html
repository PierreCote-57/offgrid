<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="~{fragments/site/header}"></div>

<main class="og-chat-page">
	<h1 th:text="${PageName}">Chat</h1>

	<div class="og-chat" x-data="chat">
		<div class="og-chat-log" x-ref="log">
			<template x-for="(message, index) in messageList" :key="index">
				<div class="og-chat-bubble" :class="'og-chat-' + message.role">
					<div class="og-chat-text" x-text="message.text"></div>
					<div class="og-chat-timing" x-show="message.timeText"
						 x-text="message.timeText"></div>
					<div class="og-chat-timing" x-show="message.durationText">
						<span x-text="'answered in ' + message.durationText"></span>
						<span x-show="message.effectiveTokenText"
							  x-text="' using ' + message.effectiveTokenText + ' effective tokens'"></span>
						<span x-show="message.stopText"
							  x-text="', stopped at ' + message.stopText"></span>
					</div>
				</div>
			</template>
			<div class="og-chat-bubble og-chat-assistant og-chat-waiting" x-show="busy">…</div>
		</div>

		<div class="og-chat-error" x-show="error" x-text="error" x-cloak></div>

		<div class="og-chat-input">
			<input type="text" x-model="draft" :disabled="busy" placeholder="Say something"
				   @keydown.enter="send()">
			<button type="button" :disabled="busy" @click="send()">Send</button>
		</div>
	</div>
</main>

<div th:replace="~{fragments/site/footer}"></div>
</html>
