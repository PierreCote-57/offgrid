<head xmlns:th="http://www.thymeleaf.org">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${PageName} + ' — ' + ${SiteName}">offgrid</title>
	<link rel="stylesheet" th:href="@{/css/site.css}">
	<script defer th:src="@{/js/alpine.min.js}"></script>
	<script defer th:src="@{/js/gl-constants.js}"></script>
	<script defer th:src="@{/js/lightbox.js}"></script>
	<script defer th:src="@{/js/google-map.js}"></script>
	<script defer th:src="@{/js/offgrid.js}"></script>
	<script defer th:src="@{/js/browser.js}"></script>
</head>
<body>
<header xmlns:th="http://www.thymeleaf.org" class="site-header">
	<a class="brand" th:href="@{/}" th:text="${WelcomeMessage}"></a>
	<div th:replace="~{fragments/site/menu}"></div>
</header>

<div xmlns:th="http://www.thymeleaf.org" class="messages">
	<div class="message message-user" th:each="userMessage : ${UserMessageList}" th:text="${userMessage}"></div>
	<div class="message message-warning" th:each="warningMessage : ${WarningMessageList}" th:text="${warningMessage}"></div>
	<div class="message message-error" th:each="errorMessage : ${ErrorMessageList}" th:text="${errorMessage}"></div>
</div>
