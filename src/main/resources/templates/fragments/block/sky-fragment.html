<!--
	The sky page's blocks. The file is named for the page and holds all of them, rather than
	one file per fragment: they are the parts of one page and nothing else includes them.

		datePicker   the date, and the control that changes it
		chart        the drawing on the page, as an image at the width asked for
		table        rise, transit and set, with the observer underneath
		drawing      the chart itself, an SVG document, served at /sky/chart.svg

	Each one carries the element the page lays out, so a page places a block with th:replace
	and states nothing about it. Only the chart takes a parameter; everything else, the date
	included, each fragment reads off the model.
-->

<!--
	The date is the page's one control. The button carries the words and the look; the date
	input beside it is transparent and 1px, and exists because the browser anchors its own
	calendar to an input and to nothing else. OG.wireDatePicker opens it.

	A GET form, so picking a day is an ordinary page load and the browser writes the query
	string. The coordinates ride along as hidden fields, or picking a date would put the
	visitor back at the default marker.
-->
<form xmlns:th="http://www.thymeleaf.org" th:fragment="datePicker"
	  class="og-sky-datebox" th:action="@{/info/sky}" method="get">
	<input type="hidden" name="latitude" th:value="${skyTable.latitude}">
	<input type="hidden" name="longitude" th:value="${skyTable.longitude}">

	<button type="button" class="og-sky-date"
			th:text="${#temporals.format(skyTable.date, 'EEE yyyy-MM-dd')}">Mon 2026-09-07</button>
	<input type="date" class="og-sky-date-input" name="date"
		   th:value="${skyTable.date}" th:min="${skyFirstDate}" th:max="${skyLastDate}">
</form>

<!--
	The chart on the page: an img pointing at the drawing, which the browser fetches as its
	own request. That request carries the date, or it would answer today beside another day's
	table.

	The width is stated here and nowhere else. It goes to the request, and to the img's own
	width and height, which is what makes the image exactly that size; the drawing is square,
	so the two are the same number. A page places the chart at whatever width it wants and
	changes nothing else.

	The caption is page text under the image rather than a line inside the drawing, so it reads
	at the page's size whatever the chart is drawn at.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="chart(width)" class="og-sky-chart">
	<img th:src="@{/sky/chart.svg(width=${width}, date=${skyTable.date})}" src=""
		 th:width="${width}" th:height="${width}"
		 alt="The Sun, the eight planets and the Moon, each on its orbit, seen from above">
	<p class="og-sky-caption" th:text="${skyChartCaption}">Not to scale</p>
</div>

<!--
	A body with no rise time is drawn on the chart but not tabled. Each heading states its
	column, the table is laid out fixed so those widths bind, and the table is as wide as they
	add up to.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="table" class="og-sky-table">

	<table style="table-layout:fixed;width:max-content">
		<thead>
			<tr>
				<th style="width:70px">Body</th>
				<th style="width:50px">Rises</th>
				<th style="width:90px">Transit</th>
				<th style="width:50px">Sets</th>
				<th style="width:120px">Period</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="body : ${skyTable.bodyList}" th:if="${body.rises != null}">
				<td th:text="${body.name}"></td>
				<td th:text="${body.rises}"></td>
				<td th:text="${body.transit}"></td>
				<td th:text="${body.sets}"></td>
				<td th:text="${body.orbitPeriod == null ? ''
						: T(com.lc.basics.tools.units.TimeUnits).DAY.format(body.orbitPeriod)}"></td>
			</tr>
		</tbody>
	</table>

	<div class="og-sky-observer">
		<p><strong class="og-sky-place"></strong><span class="og-sky-place-dash" hidden> &mdash; </span><span
				th:text="|${#numbers.formatDecimal(T(java.lang.Math).abs(skyTable.latitude), 1, 'POINT', 4, 'POINT')}°${skyTable.latitude >= 0 ? 'N' : 'S'}, ${#numbers.formatDecimal(T(java.lang.Math).abs(skyTable.longitude), 1, 'POINT', 4, 'POINT')}°${skyTable.longitude >= 0 ? 'E' : 'W'}|"></span></p>
		<p th:text="${#temporals.format(skyTable.zonedDate, 'VV (OOOO)')}"></p>
	</div>

	<script th:inline="javascript">
		/*
		 * The place name is not in the page, because the server has coordinates and not a name.
		 * This asks Google what is at those coordinates and writes the answer in when it comes
		 * back, so the line renders at once with the numbers and gains its name a moment later.
		 * No answer means no name, and the numbers stand on their own.
		 *
		 * It goes through the Maps JavaScript API rather than the geocoding web service: the
		 * site's key is restricted by referrer, and the web service refuses such a key outright.
		 *
		 * Every step is logged, timestamped, so a page that shows no name says why in the
		 * console: the script, the call, Google's own status, and what was made of the answer.
		 */
		(function () {
			"use strict";

			var latitude = [[${skyTable.latitude}]];
			var longitude = [[${skyTable.longitude}]];

			// One place builds the stamp, so no call site carries a time of its own.
			function stamp() {
				var text = new Date().toLocaleTimeString("en-GB", {
					hour: "2-digit", minute: "2-digit", second: "2-digit",
					fractionalSecondDigits: 3, hour12: false
				});
				return text + " [sky] ";
			}
			function log(message) {
				console.log(stamp() + message);
			}
			function logError(message) {
				console.error(stamp() + message);
			}

			// The town, then the province's short form: "Campbell River", "BC".
			function placeName(result) {
				var componentList = result.address_components || [];
				var town = null;
				var region = null;
				componentList.forEach(function (component) {
					if (component.types.indexOf("locality") >= 0) { town = component.long_name; }
					if (component.types.indexOf("administrative_area_level_1") >= 0) { region = component.short_name; }
				});
				if (!town) { return null; }
				return region ? town + ", " + region : town;
			}

			/*
			 * Google answers a point with a stack of results, finest first: the street, then the
			 * neighbourhood, the town, the district, the province. Only some carry a locality,
			 * so this takes the first one that does.
			 */
			function firstNamed(resultList) {
				for (var index = 0; index < resultList.length; index++)
				{
					var name = placeName(resultList[index]);
					if (name) {
						log("Result " + index + " of " + resultList.length + " gave \"" + name + "\".");
						return name;
					}
				}
				log("No result carried a locality; the types were "
						+ resultList.map(function (result) { return result.types.join("/"); }).join(", ")
						+ ".");
				return null;
			}

			function lookUpPlace() {
				var placeList = document.querySelectorAll(".og-sky-place");
				var dashList = document.querySelectorAll(".og-sky-place-dash");
				if (placeList.length === 0) {
					logError("No .og-sky-place element on the page; nothing to fill in.");
					return;
				}
				if (!window.OG || !window.OG.loadGoogleMapsApi) {
					logError("OG.loadGoogleMapsApi is not there; the name cannot be looked up.");
					return;
				}

				var startedAt = Date.now();
				log("Loading the Maps JavaScript API to reverse geocode " + latitude + "," + longitude + ".");

				window.OG.loadGoogleMapsApi(function () {
					log("Maps API ready after " + (Date.now() - startedAt) + "ms; asking the geocoder.");

					var geocoder = new google.maps.Geocoder();
					var request = { location: { lat: latitude, lng: longitude } };

					geocoder.geocode(request)
						.then(function (answer) {
							var resultList = answer.results || [];
							log("Geocoder answered " + resultList.length + " result(s) after "
									+ (Date.now() - startedAt) + "ms.");

							var name = firstNamed(resultList);
							if (!name) {
								log("No name applied; the coordinates stand on their own.");
								return;
							}

							placeList.forEach(function (placeElement) {
								placeElement.textContent = name;
							});
							dashList.forEach(function (dashElement) {
								dashElement.hidden = false;
							});
							log("Wrote \"" + name + "\" into " + placeList.length + " observer line(s).");
						})
						.catch(function (failure) {
							logError("The geocoder failed after " + (Date.now() - startedAt) + "ms: "
									+ failure.message);
						});
				});
			}

			/*
			 * og-constants.js and google-map.js are deferred, so neither has run while this
			 * inline script is being parsed and window.OG does not exist yet. DOMContentLoaded
			 * fires after every deferred script, which is the first moment they are there.
			 */
			if (document.readyState === "loading") {
				log("Waiting for DOMContentLoaded; the deferred scripts have not run yet.");
				document.addEventListener("DOMContentLoaded", lookUpPlace);
			}
			else {
				lookUpPlace();
			}
		})();
	</script>
</div>

<!--
	The drawing on its own, served at /sky/chart.svg so the browser treats it as an image. It
	is its own document: the palette and the label font live here rather than in site.css, and
	nothing on the page reaches inside it. The chart fragment above is the img that points at
	it.

	No named entity may appear below — an SVG document is parsed as XML, which knows only the
	five built-in ones. It carries no title or desc either: through an img tag the browser
	never exposes them, and opened on its own it is named by its URL, like every other image
	on the site.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org" th:fragment="drawing(width)"
	 th:with="positionMap=${skyChart.setCanvas(width)}"
	 th:attr="viewBox=${skyChart.viewBox}" role="img">
	<style>
		svg {
			--border-strong: #8c877d;
			--coral: #c8553d;
			--amber: #c08a2e;
			--teal: #2f7e76;
			--sun: #f5c400;
			--moon: #ffffff;
			--text: #243027;
		}
		.c-coral { fill: var(--coral); }
		.c-amber { fill: var(--amber); }
		.c-teal  { fill: var(--teal); }
		.c-sun   { fill: var(--sun); }
		.c-moon  { fill: var(--moon); stroke: var(--border-strong); stroke-width: 0.75; }
		.ts {
			font-size: 12px;
			fill: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
	</style>

	<circle th:each="body : ${skyChart.bodyList}" th:if="${body.parent != null}"
			th:cx="${positionMap[body.parent.name].dotX}" th:cy="${positionMap[body.parent.name].dotY}"
			th:r="${positionMap[body.name].orbitRadius}"
			fill="none" stroke="var(--border-strong)" stroke-width="0.5"/>

	<circle th:each="body : ${skyChart.bodyList}"
			th:cx="${positionMap[body.name].dotX}" th:cy="${positionMap[body.name].dotY}"
			th:r="${positionMap[body.name].dotRadius}"
			th:class="${body.colourClass}"/>

	<text th:each="body : ${skyChart.bodyList}" th:if="${body.labelText != null}" class="ts"
		  th:x="${positionMap[body.name].labelX}" th:y="${positionMap[body.name].labelY}"
		  th:attr="text-anchor=${positionMap[body.name].labelAnchor}" th:text="${body.labelText}"></text>
</svg>
