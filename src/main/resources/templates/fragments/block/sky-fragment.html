<!--
	The sky page's blocks. The file is named for the page and holds all of them, rather than
	one file per fragment: they are the parts of one page and nothing else includes them.

		datePicker   the date, and the control that changes it, for the blocks in one element
		chart        the element sky.js draws the chart into, at the width asked for
		table        the element sky.js fills with rise, transit and set, and the observer
		drawing      the chart itself, an SVG document, served at /sky/chart.svg

	Each one carries the element the page lays out, so a page places a block with th:replace
	and states nothing about it. The chart takes its width and the table takes isWide; the
	datePicker reads the model.
-->

<!--
	A date control. The button carries the words and the look; the date input beside it is
	transparent and 1px, and exists because the browser anchors its own calendar to an input and
	to nothing else. OG.openDatePicker opens it, hooked on the button's onclick.

	scopeId is the id of the element holding the charts and tables this date drives, so a page may
	carry several controls, each answering for its own block. A control given no id drives every
	block on the page.

	Picking a day asks /rest/sky/data for it: nothing is submitted and the page never loads again,
	which is why there is no form here and no coordinates ride along.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="datePicker(scopeId)" class="og-sky-datebox"
	 th:attr="data-scope=${scopeId}">
	<span class="og-sky-datebox-label">The sky on</span>

	<button type="button" class="og-sky-date" onclick="OG.openDatePicker(this)"
			th:text="${#temporals.format(skyTable.date, 'EEE yyyy-MM-dd')}">Mon 2026-09-07</button>
	<input type="date" class="og-sky-date-input"
		   th:value="${skyTable.date}" th:min="${skyFirstDate}" th:max="${skyLastDate}">
</div>

<!--
	The chart's block: the element sky.js draws into, and nothing in it. The drawing is built
	from what /rest/sky/data answers, so the page can ask again — another date, another place —
	and only this block changes.

	The width is stated here and nowhere else. It rides on the element as data-width, because
	the browser is what reads it, and it is the drawing element's own width and height, so the
	space is held from the first paint and the caption never moves when the chart arrives. The
	drawing is square, so one number is the whole canvas. A page places the chart at whatever
	width it wants and changes nothing else.

	The caption is a line at the bottom of the drawing, under the outermost orbit, so it sits as
	close to the chart as the margin allows. Its words come from the model and ride on the block
	as data-caption, the browser being what draws them.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="chart(width)" class="og-sky-chart"
	 th:attr="data-width=${width}, data-caption=${skyChartCaption}">
	<div class="og-sky-drawing" th:style="|width: ${width}px; height: ${width}px|"></div>
</div>

<!--
	The table's block: the two elements sky.js fills, and nothing in them. The rows and the
	observer line under them are both built from what /rest/sky/data answers, so the page can
	ask again — another date, another place — and only this block changes.

	isWide states which set of columns the block wants. It rides on the element as data-wide,
	because the browser is what reads it; the two column lists are in sky.js.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="table(isWide)" class="og-sky-table"
	 th:attr="data-wide=${isWide}">
	<table></table>
	<div class="og-sky-observer"></div>
</div>

<!--
	The drawing on its own, served at /sky/chart.svg so the browser treats it as an image. It
	is its own document: the palette and the label font live here rather than in site.css, and
	nothing on the page reaches inside it. The chart fragment above is the img that points at
	it.

	No named entity may appear below — an SVG document is parsed as XML, which knows only the
	five built-in ones. It carries no title or desc either: through an img tag the browser
	never exposes them, and opened on its own it is named by its URL, like every other image
	on the site.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org" th:fragment="drawing(width)"
	 th:with="positionMap=${skyChart.setCanvas(width)}"
	 th:attr="viewBox=${skyChart.viewBox}" role="img">
	<style>
		svg {
			--border-strong: #8c877d;
			--coral: #c8553d;
			--amber: #c08a2e;
			--teal: #2f7e76;
			--sun: #f5c400;
			--moon: #ffffff;
			--text: #243027;
		}
		.c-coral { fill: var(--coral); }
		.c-amber { fill: var(--amber); }
		.c-teal  { fill: var(--teal); }
		.c-sun   { fill: var(--sun); }
		.c-moon  { fill: var(--moon); stroke: var(--border-strong); stroke-width: 0.75; }
		.ts {
			font-size: 12px;
			fill: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
	</style>

	<circle th:each="body : ${skyChart.bodyList}" th:if="${body.parent != null}"
			th:cx="${positionMap[body.parent.name].dotX}" th:cy="${positionMap[body.parent.name].dotY}"
			th:r="${positionMap[body.name].orbitRadius}"
			fill="none" stroke="var(--border-strong)" stroke-width="0.5"/>

	<circle th:each="body : ${skyChart.bodyList}"
			th:cx="${positionMap[body.name].dotX}" th:cy="${positionMap[body.name].dotY}"
			th:r="${positionMap[body.name].dotRadius}"
			th:class="${body.colourClass}"/>

	<text th:each="body : ${skyChart.bodyList}" th:if="${body.labelText != null}" class="ts"
		  th:x="${positionMap[body.name].labelX}" th:y="${positionMap[body.name].labelY}"
		  th:attr="text-anchor=${positionMap[body.name].labelAnchor}" th:text="${body.labelText}"></text>
</svg>
