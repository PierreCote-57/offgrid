<!--
	Four rows, always all four: an empty row says NA rather than disappearing, so the table
	says what is known AND what is not.

	Go Fish BC wants the bare waterbody name rather than a url, and every lake here is on
	Vancouver Island, so the region is fixed into stockingUrl below.
-->
<div xmlns:th="http://www.thymeleaf.org" class="og-fishing"
	 th:with="fishing=${pageData.fishingReferences},
			  stockingUrl='https://www.gofishbc.com/stocked-fish/?reportType=lake&amp;region=VANCOUVER%20ISLAND&amp;waterbody='">
	<h3 class="og-heading">Fishing references</h3>

	<table>
		<tbody>
		<tr>
			<td class="og-fishing-label">BC Identifier</td>
			<td class="og-fishing-value" th:text="${fishing?.bcIdentifier} ?: 'NA'">NA</td>
		</tr>
		<tr>
			<td class="og-fishing-label">Area</td>
			<td class="og-fishing-value"
				th:text="${fishing?.areaKm2 == null} ? 'NA' : ${fishing.areaKm2} + ' km²'">NA</td>
		</tr>
		<tr>
			<td class="og-fishing-label">Lake chart</td>
			<td class="og-fishing-value">
				<span th:if="${#maps.isEmpty(fishing?.lakeChartMap)}">NA</span>
				<span th:each="chart, iter : ${fishing?.lakeChartMap}">
					<br th:if="${!iter.first}">
					<span th:replace="~{fragments/block/link :: link(${chart.value})}"></span>[[${chart.key}]]</a>
				</span>
			</td>
		</tr>
		<tr>
			<td class="og-fishing-label">Stocking report</td>
			<td class="og-fishing-value">
				<span th:if="${#strings.isEmpty(fishing?.stockingName)}">NA</span>
				<th:block th:unless="${#strings.isEmpty(fishing?.stockingName)}"
						  th:with="stockingLink=${stockingUrl + #uris.escapeQueryParam(fishing.stockingName)}"><span
						th:replace="~{fragments/block/link :: link(${stockingLink})}"></span>Go Fish BC</a></th:block>
			</td>
		</tr>
		</tbody>
	</table>
</div>
