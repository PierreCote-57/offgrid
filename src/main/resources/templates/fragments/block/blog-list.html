<!--
	The blog list: one row per entry, newest first. The model carries
	List<Map.Entry<String, BlogPage>> under blogList — the key is the json's file name, which
	is also the url segment, and the value is the page.

	No parameter. There is only ever one blog list on a page, so the attribute name is enough
	to find it, and how many rows it draws is the processor's decision rather than this
	fragment's: the home page puts a short list under the same name.

	The title is the link, per the block/link fragment, which is why the <a> is opened by a
	th:replace and closed here.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="blogList" class="og-blog-list">
	<div class="og-blog-row" th:each="entry : ${blogList}">
		<img class="og-blog-thumb" th:alt="${entry.value.name}" alt=""
			 th:src="@{/image/{imageName}(imageName=${entry.value.featuredImage}, size='small')}" src="">
		<div class="og-blog-detail">
			<p class="og-blog-line"><span
					th:replace="~{fragments/block/link :: link('/blog/' + ${entry.key})}"></span>[[${entry.value.name}]]</a>
				<span class="og-blog-date"
					  th:text="${#temporals.format(entry.value.date, 'MMMM d, yyyy')}">August 15, 2026</span>
			</p>
			<p class="og-blog-excerpt" th:text="${entry.value.excerpt}">Two lines of the entry's own words,
				cut off at the second one.</p>
		</div>
	</div>
</div>
