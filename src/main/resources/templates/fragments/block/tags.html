<!--
		badgeList    LEFT    what you would do there      (coloured)
		road         RIGHT   what it costs to get there   (coloured, + km)
		keywordList  BELOW   everything else              (plain)

	typeList is deliberately absent: it filters, and the page already says what kind of place
	it is.

	og-tag is the same pill class a gallery card writes, and no colour is written here:
	offgrid.js paints both from the one palette in og-constants.js. A badge and a road are
	enum constants, lower-cased into the word those palettes are keyed by.
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:with="roadLeg=${pageData.access?.roadLimitingLeg},
		  roadWord=${roadLeg?.type?.name()?.toLowerCase()}">
	<div class="og-tags"
		 th:if="${roadLeg != null or (pageData.tags != null and (!#lists.isEmpty(pageData.tags.badgeList) or !#lists.isEmpty(pageData.tags.keywordList)))}">

		<div class="og-tagrow"
			 th:if="${roadLeg != null or (pageData.tags != null and !#lists.isEmpty(pageData.tags.badgeList))}">
			<div class="og-tagrow-group">
				<th:block th:if="${pageData.tags != null and !#lists.isEmpty(pageData.tags.badgeList)}">
					<span class="og-tag" th:each="badge : ${#lists.sort(pageData.tags.badgeList)}"
						  th:with="badgeWord=${badge.name().toLowerCase()}"
						  th:attr="data-tag=${badgeWord}" th:text="${badgeWord}">badge</span>
				</th:block>
			</div>
			<div class="og-tagrow-group">
				<span th:if="${roadLeg != null}" class="og-tag"
					  th:attr="data-road=${roadWord}"
					  th:text="${#strings.replace(roadWord, '_', ' ')}">road</span>
				<span th:if="${roadLeg?.km != null}" class="og-tagrow-km"
					  th:with="wholeKm=${roadLeg.km == roadLeg.km.longValue()}"
					  th:text="${wholeKm ? roadLeg.km.longValue() : roadLeg.km} + ' km'">5 km</span>
			</div>
		</div>

		<div class="og-tagrow-keywords"
			 th:if="${pageData.tags != null and !#lists.isEmpty(pageData.tags.keywordList)}">
			<div class="og-tagrow-group">
				<span class="og-tag" data-tag="plain" th:each="keyword : ${#lists.sort(pageData.tags.keywordList)}"
					  th:text="${keyword}">keyword</span>
			</div>
		</div>
	</div>
</th:block>
