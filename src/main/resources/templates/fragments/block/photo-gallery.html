<div xmlns:th="http://www.thymeleaf.org" th:fragment="gallery(galleryName)" class="gl-gallery-grid"
	 th:with="galleryData=${pageData.photoGalleries == null ? null : pageData.photoGalleries.get(galleryName)}">
	<figure class="gl-gallery-item" th:each="item : ${galleryData?.itemList}">
		<img style="width:100%;display:block;" th:src="@{/image/{imageName}(imageName=${item.img})}"
			 th:alt="${item.label}" src="" alt="">
		<figcaption th:text="${item.label}">Caption</figcaption>
	</figure>
</div>
