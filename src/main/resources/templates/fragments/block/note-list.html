<div xmlns:th="http://www.thymeleaf.org" class="note-list">
	<section class="note-section" th:each="noteSection : ${pageData.noteList}">
		<h3 class="gl-heading" th:text="${noteSection.sectionName}">Section name</h3>

		<table>
			<tbody>
			<!-- A url starting with / is one of our own routes: it stays in this tab, and when
			     it carries no description of its own the site's name is the description. -->
			<tr th:each="noteItem : ${noteSection.itemList}"
				th:with="internal=${noteItem.url != null and #strings.startsWith(noteItem.url, '/')}">
				<td class="note-name">
					<a th:if="${noteItem.url}" th:href="${noteItem.url}"
					   th:attr="target=${internal} ? null : '_blank',
					            rel=${internal} ? null : 'noopener'"
					   th:text="${noteItem.name}">Name</a>
					<span th:unless="${noteItem.url}" th:text="${noteItem.name}">Name</span>
				</td>
				<td class="note-description"
					th:utext="${internal and noteItem.description == null}
					          ? |On ${SiteName}|
					          : ${#strings.listJoin(noteItem.description, ' ')}">Description</td>
			</tr>
			</tbody>
		</table>
	</section>
</div>
