<!--
	The noteMap key IS the heading, so a block keyed by the empty string renders no <h3> —
	which is what a block sitting inside its own <details> wants, the <summary> being its
	heading.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="notes(noteName)" class="og-note-list"
	 th:with="noteItemList=${pageData.noteMap == null ? null : pageData.noteMap.get(noteName)}">
	<section class="og-note-section" th:if="${noteItemList != null}">
		<h3 class="og-heading" th:if="${!#strings.isEmpty(noteName)}" th:text="${noteName}">Section name</h3>

		<table>
			<tbody>
			<!-- A url starting with / is one of our own routes: when it carries no description
			     of its own, the site's name is the description. -->
			<tr th:each="noteItem : ${noteItemList}"
				th:with="internal=${noteItem.url != null and #strings.startsWith(noteItem.url, '/')}">
				<td class="og-note-name">
					<th:block th:if="${noteItem.url}"><span
						th:replace="~{fragments/block/link :: link(${noteItem.url})}"></span>[[${noteItem.name}]]</a></th:block>
					<span th:unless="${noteItem.url}" th:text="${noteItem.name}">Name</span>
				</td>
				<td class="og-note-description"
					th:utext="${internal and noteItem.description == null}
					          ? |On ${SiteName}|
					          : ${#strings.listJoin(noteItem.description, ' ')}">Description</td>
			</tr>
			</tbody>
		</table>
	</section>
</div>
