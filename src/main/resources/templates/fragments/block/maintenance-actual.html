<div xmlns:th="http://www.thymeleaf.org"
	 th:if="${pageData.actualList != null and not #lists.isEmpty(pageData.actualList)}">
	<table class="gl-maintenance">
		<colgroup>
			<col style="width:15%;"/>
			<col style="width:15%;"/>
			<col style="width:15%;"/>
			<col style="width:30%;"/>
			<col style="width:10%;"/>
			<col style="width:15%;"/>
		</colgroup>
		<thead>
		<tr>
			<th>Date</th>
			<th>Odometer</th>
			<th>Shop</th>
			<th>Work</th>
			<th>Cost</th>
			<th>Next due</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="entry : ${pageData.actualList}">
			<td th:text="${entry.date}">Date</td>
			<td th:text="${entry.odometerKm == null} ? '' : ${#numbers.formatInteger(entry.odometerKm, 1, 'COMMA') + ' km'}">Odometer</td>
			<td>
				<a th:if="${entry.shopUrl}" th:href="${entry.shopUrl}" target="_blank"
				   rel="noopener" th:text="${entry.shopName}">Shop</a>
				<span th:unless="${entry.shopUrl}" th:text="${entry.shopName}">Shop</span>
			</td>
			<td>
				<a th:if="${entry.workUrl}" target="_blank" rel="noopener"
				   th:href="@{/document/{documentName}(documentName=${entry.workUrl})}"
				   th:text="${entry.workName}">Work</a>
				<span th:unless="${entry.workUrl}" th:text="${entry.workName}">Work</span>
			</td>
			<td th:text="${entry.costCad == null} ? '' : ${'$' + #numbers.formatDecimal(entry.costCad, 1, 'COMMA', 2, 'POINT')}">Cost</td>
			<td>
				<span th:if="${entry.nextDueKm}"
					  th:text="${#numbers.formatInteger(entry.nextDueKm, 1, 'COMMA') + ' km'}">Next km</span>
				<br th:if="${entry.nextDueKm != null and entry.nextDueDate != null}"/>
				<span th:if="${entry.nextDueDate}" th:text="${entry.nextDueDate}">Next date</span>
			</td>
		</tr>
		</tbody>
	</table>
</div>
