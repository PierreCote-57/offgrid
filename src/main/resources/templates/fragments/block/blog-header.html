<!--
	The head of one blog post: the featured image on the left, the title beside it and the
	date under the title. It is the blog list's row, with the post's own <h1> in place of the
	link and no excerpt — the excerpt's job is to stand in for a page the reader has not
	opened, and this is that page.

	The date stacks rather than sitting at the end of the title's line, which is where the
	list puts it: the list has a column of dates to scan down, a post has one, and stacking
	it fills the space the 80px thumbnail leaves under a one-line title.

	No parameter: it draws the page being rendered, off PageName and pageData. Every post
	calls it with the same line, and it is the only place the date's format is written for a
	post.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="blogHeader" class="og-blog-row og-blog-header">
	<img class="og-blog-thumb" th:alt="${PageName}" alt=""
		 th:src="@{/image/{imageName}(imageName=${pageData.featuredImage}, size='small')}" src="">
	<div class="og-blog-detail">
		<h1 th:text="${PageName}">First try</h1>
		<span class="og-blog-date"
			  th:text="${#temporals.format(pageData.date, 'MMMM d, yyyy')}">June 6, 2026</span>
	</div>
</div>
