<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="ref(photoId)"
		  th:with="galleryName=${#strings.substringBefore(photoId, '/')},
				   itemId=${#strings.substringAfter(photoId, '/')}">
	<th:block th:with="gallery=${pageData.photoGalleries == null ? null : pageData.photoGalleries.get(galleryName)},
					   item=${gallery == null ? null : gallery.get(itemId)}">
		<!-- The href has to match the figure id photo-gallery writes: og-photo-<gallery>-<id>. -->
		<a th:if="${item != null}" th:href="'#og-photo-' + ${galleryName} + '-' + ${itemId}"
		   th:text="${item.label} ?: ${itemId}" href="">label</a>
		<span th:if="${item == null}" class="og-block-unavailable-inline"
			  th:text="'image unavailable: ' + ${photoId}">image unavailable</span>
	</th:block>
</th:block>
