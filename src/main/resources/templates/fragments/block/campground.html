<!--
	Every link a campground carries, in one row: its site, its map, and where to book.

	Three passes, in that order, because the row reads by what each link IS and not by the
	order the file happens to list them. The homepage is the one entry whose word is not its
	label — it always reads "Website".

	A link with no url renders as plain text: a reservation that says how booking works, with
	nothing to click, is a real entry. Thymeleaf drops an attribute whose value is null, which
	is exactly that.

	The separator lives in site.css, so the row reads the same whichever of the three a place
	has. Nothing renders at all when the page carries no campgroundData.
-->
<p xmlns:th="http://www.thymeleaf.org" class="gl-linkrow"
   th:if="${pageData.campgroundData != null}">
	<a th:each="reference : ${pageData.campgroundData.referenceList}"
	   th:if="${reference.type != null and reference.type.name() == 'HOMEPAGE'}"
	   th:href="${reference.url}" target="_blank" rel="noopener noreferrer">Website</a>
	<a th:each="reference : ${pageData.campgroundData.referenceList}"
	   th:if="${reference.type != null and reference.type.name() == 'MAP'}"
	   th:href="${reference.url}" th:text="${reference.label}"
	   target="_blank" rel="noopener noreferrer">Campground</a>
	<a th:each="reference : ${pageData.campgroundData.referenceList}"
	   th:if="${reference.type != null and reference.type.name() == 'RESERVATION'}"
	   th:href="${reference.url}" th:text="${reference.label}"
	   target="_blank" rel="noopener noreferrer">Reservation</a>
</p>
