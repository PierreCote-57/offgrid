<!--
	Three passes over the same list, so the row reads in this order whatever order the file
	lists them in. A reference with no url is a real entry — booking instructions with nothing
	to click — and renders as the th:unless text, the link fragment taking no null.
-->
<p xmlns:th="http://www.thymeleaf.org" class="og-linkrow"
   th:if="${pageData.campgroundData != null}">
	<!-- The homepage is the one entry whose word is fixed: it always reads "Website". -->
	<th:block th:each="reference : ${pageData.campgroundData.referenceList}"
			  th:if="${reference.type != null and reference.type.name() == 'HOMEPAGE'}"><th:block
			th:if="${reference.url}"><span
			th:replace="~{fragments/block/link :: link(${reference.url})}"></span>Website</a></th:block><span
			th:unless="${reference.url}">Website</span></th:block>
	<th:block th:each="reference : ${pageData.campgroundData.referenceList}"
			  th:if="${reference.type != null and reference.type.name() == 'MAP'}"><th:block
			th:if="${reference.url}"><span
			th:replace="~{fragments/block/link :: link(${reference.url})}"></span>[[${reference.label}]]</a></th:block><span
			th:unless="${reference.url}" th:text="${reference.label}">Campground</span></th:block>
	<th:block th:each="reference : ${pageData.campgroundData.referenceList}"
			  th:if="${reference.type != null and reference.type.name() == 'RESERVATION'}"><th:block
			th:if="${reference.url}"><span
			th:replace="~{fragments/block/link :: link(${reference.url})}"></span>[[${reference.label}]]</a></th:block><span
			th:unless="${reference.url}" th:text="${reference.label}">Reservation</span></th:block>
</p>
