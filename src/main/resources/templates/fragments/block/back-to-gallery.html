<!--
	The way back to the gallery the page was reached from.

	Resolved on the server, so the link is in the page as it arrives: backQuery is the query
	the gallery is restored with, and backName is what that gallery is called.
-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="back()" class="og-dest-back">
	<a th:href="'/shared/browser?' + ${backQuery}"
	   th:text="'← Back to ' + ${backName}" href="">← Back</a>
</div>
