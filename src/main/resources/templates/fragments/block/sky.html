<!--
	The sky block: the date, the chart, and the rise/transit/set table, all from the skyChart
	the processor put on the model.

	The chart comes in as an image from /sky/chart.svg, which is the second fragment in this
	file. That is what lets the reader open it on its own; the cost is that the page's CSS
	cannot reach inside it.

	The table walks the same body list as the chart, and a body with no rise time is drawn but
	not tabled. The styles here stay in this file while the page is being worked out, so
	nothing about it reaches site.css.
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sky">

	<style>
		.sky-row {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
			align-items: flex-start;
		}
		.sky-row .sky-chart { flex: 0 0 430px; }
		.sky-row .sky-table { flex: 1 1 380px; }

		/* The date heads the block; the observer is centred under the table it labels, the
		   way "Not to scale" is centred on the chart. Heading size without .gl-heading, whose
		   rule and brand colour would make this read as a section divider. */
		.sky-date {
			margin: 0 0 16px;
			text-align: center;
			color: var(--text);
			font-size: 20px;
			font-weight: 600;
		}
		.sky-table .sky-observer { text-align: center; }
		.sky-observer p { margin: 0; }

		/* The chart arrives as its own document, so its colours are inside it, not here. */
		.sky-chart img {
			display: block;
			width: 100%;
		}

		/* The body names read down the left edge; every measurement is centred under its heading. */
		.sky-table table { width: 100%; }
		.sky-table th,
		.sky-table td { text-align: center; }
		.sky-table th:first-child,
		.sky-table td:first-child { text-align: left; }
	</style>

	<h2 class="sky-date" th:text="${skyChart.dateText}"></h2>

	<div class="sky-row">
		<div class="sky-chart">
			<img th:src="@{/sky/chart.svg}" th:alt="${skyChart.title}" src="" alt="">
		</div>

		<div class="sky-table">
			<table>
				<thead>
					<tr>
						<th>Body</th>
						<th>Rises</th>
						<th>Transit</th>
						<th>Sets</th>
						<th>Orbit</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="body : ${skyChart.bodyList}" th:if="${body.rises != null}">
						<td th:text="${body.name}"></td>
						<td th:text="${body.rises}"></td>
						<td th:text="${body.transit}"></td>
						<td th:text="${body.sets}"></td>
						<td th:text="${body.orbitPeriodText}"></td>
					</tr>
				</tbody>
			</table>

			<div class="sky-observer">
				<p><strong class="sky-place"></strong><span class="sky-place-dash" hidden> &mdash; </span><span
						th:text="${skyChart.coordinateText}"></span></p>
				<p th:text="${skyChart.timeZoneName}"></p>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*
		 * The place name is not in the page, because the server has coordinates and not a name.
		 * This asks Google what is at those coordinates and writes the answer in when it comes
		 * back, so the line renders at once with the numbers and gains its name a moment later.
		 * No answer means no name, and the numbers stand on their own.
		 *
		 * It goes through the Maps JavaScript API rather than the geocoding web service: the
		 * site's key is restricted by referrer, and the web service refuses such a key outright.
		 *
		 * Every step is logged, timestamped, so a page that shows no name says why in the
		 * console: the script, the call, Google's own status, and what was made of the answer.
		 */
		(function () {
			"use strict";

			var latitude = [[${skyChart.latitude}]];
			var longitude = [[${skyChart.longitude}]];

			// One place builds the stamp, so no call site carries a time of its own.
			function stamp() {
				var text = new Date().toLocaleTimeString("en-GB", {
					hour: "2-digit", minute: "2-digit", second: "2-digit",
					fractionalSecondDigits: 3, hour12: false
				});
				return text + " [sky] ";
			}
			function log(message) {
				console.log(stamp() + message);
			}
			function logError(message) {
				console.error(stamp() + message);
			}

			// The town, then the province's short form: "Campbell River", "BC".
			function placeName(result) {
				var componentList = result.address_components || [];
				var town = null;
				var region = null;
				componentList.forEach(function (component) {
					if (component.types.indexOf("locality") >= 0) { town = component.long_name; }
					if (component.types.indexOf("administrative_area_level_1") >= 0) { region = component.short_name; }
				});
				if (!town) { return null; }
				return region ? town + ", " + region : town;
			}

			/*
			 * Google answers a point with a stack of results, finest first: the street, then the
			 * neighbourhood, the town, the district, the province. Only some carry a locality,
			 * so this takes the first one that does.
			 */
			function firstNamed(resultList) {
				for (var index = 0; index < resultList.length; index++)
				{
					var name = placeName(resultList[index]);
					if (name) {
						log("Result " + index + " of " + resultList.length + " gave \"" + name + "\".");
						return name;
					}
				}
				log("No result carried a locality; the types were "
						+ resultList.map(function (result) { return result.types.join("/"); }).join(", ")
						+ ".");
				return null;
			}

			function lookUpPlace() {
				var placeElement = document.querySelector(".sky-place");
				var dashElement = document.querySelector(".sky-place-dash");
				if (!placeElement) {
					logError("No .sky-place element on the page; nothing to fill in.");
					return;
				}
				if (!window.GL || !window.GL.loadGoogleMapsApi) {
					logError("GL.loadGoogleMapsApi is not there; the name cannot be looked up.");
					return;
				}

				var startedAt = Date.now();
				log("Loading the Maps JavaScript API to reverse geocode " + latitude + "," + longitude + ".");

				window.GL.loadGoogleMapsApi(function () {
					log("Maps API ready after " + (Date.now() - startedAt) + "ms; asking the geocoder.");

					var geocoder = new google.maps.Geocoder();
					var request = { location: { lat: latitude, lng: longitude } };

					geocoder.geocode(request)
						.then(function (answer) {
							var resultList = answer.results || [];
							log("Geocoder answered " + resultList.length + " result(s) after "
									+ (Date.now() - startedAt) + "ms.");

							var name = firstNamed(resultList);
							if (!name) {
								log("No name applied; the coordinates stand on their own.");
								return;
							}

							placeElement.textContent = name;
							dashElement.hidden = false;
							log("Wrote \"" + name + "\" into the observer line.");
						})
						.catch(function (failure) {
							logError("The geocoder failed after " + (Date.now() - startedAt) + "ms: "
									+ failure.message);
						});
				});
			}

			/*
			 * gl-constants.js and google-map.js are deferred, so neither has run while this
			 * inline script is being parsed and window.GL does not exist yet. DOMContentLoaded
			 * fires after every deferred script, which is the first moment they are there.
			 */
			if (document.readyState === "loading") {
				log("Waiting for DOMContentLoaded; the deferred scripts have not run yet.");
				document.addEventListener("DOMContentLoaded", lookUpPlace);
			}
			else {
				lookUpPlace();
			}
		})();
	</script>
</th:block>

<!--
	The chart on its own, served at /sky/chart.svg so the browser treats it as an image. It is
	its own document: the palette and the label font live here rather than in site.css, and
	nothing on the page reaches inside it.

	No named entity may appear below — an SVG document is parsed as XML, which knows only the
	five built-in ones.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org" th:fragment="chart"
	 th:attr="viewBox=${skyChart.viewBox}" role="img">
	<style>
		svg {
			--border-strong: #8c877d;
			--coral: #c8553d;
			--amber: #c08a2e;
			--teal: #2f7e76;
			--sun: #f5c400;
			--moon: #ffffff;
			--text: #243027;
		}
		.c-coral { fill: var(--coral); }
		.c-amber { fill: var(--amber); }
		.c-teal  { fill: var(--teal); }
		.c-sun   { fill: var(--sun); }
		.c-moon  { fill: var(--moon); stroke: var(--border-strong); stroke-width: 0.75; }
		.ts {
			font-size: 12px;
			fill: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
	</style>

	<title th:text="${skyChart.title}"></title>
	<desc th:text="${skyChart.description}"></desc>

	<circle th:each="body : ${skyChart.bodyList}" th:if="${body.parent != null}"
			th:cx="${body.parent.dotX}" th:cy="${body.parent.dotY}" th:r="${body.orbitRadius}"
			fill="none" stroke="var(--border-strong)" stroke-width="0.5"/>

	<polygon th:each="body : ${skyChart.bodyList}" th:if="${body.arrowheadPoints != null}"
			 th:attr="points=${body.arrowheadPoints}" fill="var(--border-strong)"/>

	<circle th:each="body : ${skyChart.bodyList}"
			th:cx="${body.dotX}" th:cy="${body.dotY}" th:r="${body.dotRadius}"
			th:class="${body.colourClass}"/>

	<text th:each="body : ${skyChart.bodyList}" th:if="${body.labelText != null}" class="ts"
		  th:x="${body.labelX}" th:y="${body.labelY}"
		  th:attr="text-anchor=${body.labelAnchor}" th:text="${body.labelText}"></text>

	<text class="ts" th:x="${skyChart.captionX}" th:y="${skyChart.captionY}"
		  text-anchor="middle" th:text="${skyChart.caption}"></text>
</svg>
