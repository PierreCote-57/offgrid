<!--
	The caller states the map's size on the div it wraps this in, with th:insert so that div
	survives — .og-mapbox fills whatever box it is given.
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="map(mapName)"
		  th:with="mapEntry=${pageData.googleMap != null ? pageData.googleMap.get(mapName) : null}">

	<div th:if="${mapEntry != null}" class="og-mapbox"
		 th:id="'og-map-' + ${mapName}"></div>

	<script th:inline="javascript">
		function mapObjectFor(mapEntry) {
			var pinList = [];
			var entryPinList = mapEntry.pinList || [];
			entryPinList.forEach(function (entryPin) {
				var pin = { lat: entryPin.lat, lng: entryPin.lng };
				// PIN_ICONS is keyed by the word the json writes; the serializer spells the enum
				// constant, so the word has to come back down.
				if (entryPin.icon) {
					pin.icon = entryPin.icon.toLowerCase();
				}
				if (entryPin.label) {
					pin.label = entryPin.label;
				}
				if (entryPin.url) {
					pin.url = entryPin.url;
				}
				if (entryPin.img) {
					pin.img = "/image/" + entryPin.img + "?size=small";
				}
				pinList.push(pin);
			});
			var mapObject = {
				lat: mapEntry.lat,
				lng: mapEntry.lng,
				zoom: mapEntry.zoom,
				pinList: pinList
			};
			return mapObject;
		}

		window["renderMap" + [[${mapName}]]] = function () {
			var mapObject = mapObjectFor([[${mapEntry}]]);
			var box = document.getElementById("og-map-" + [[${mapName}]]);
			window.OG.drawMap(box, mapObject);
		};

		document.addEventListener("DOMContentLoaded", function () {
			window["renderMap" + [[${mapName}]]]();
		});
	</script>

</th:block>
