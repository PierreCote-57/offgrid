<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>offgrid</title>
	<link rel="stylesheet" th:href="@{/css/site.css}">
	<script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body>
	<div th:replace="~{fragments/site/header}"></div>

	<main>
		<h1 th:text="${PageName}">Bronco Sport 2026</h1>

		<div>
			<p style="margin-top:0;">
				The Bronco Sport is the second vehicle — the one that goes where the van should not.
				Its job is the last few kilometres of an FSR to a rec site, so what it carries is
				recovery and repair gear rather than anything to live in.
			</p>
		</div>

		<details>
			<summary><h2>Extras</h2></summary>
			<div th:replace="~{fragments/block/note-list}"></div>
		</details>

		<details>
			<summary><h2>Listing pictures</h2></summary>
			<div th:replace="~{fragments/block/photo-gallery :: gallery('listing-pictures')}"></div>
		</details>

		<div th:replace="~{fragments/block/back-to-gallery}"></div>
	</main>

	<div th:replace="~{fragments/site/footer}"></div>
</body>
</html>
