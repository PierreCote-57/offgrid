<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${PageName} + ' — ' + ${SiteName}">offgrid</title>
	<link rel="stylesheet" th:href="@{/css/site.css}">
	<script defer th:src="@{/js/alpine.min.js}"></script>
	<script defer th:src="@{/js/lightbox.js}"></script>
</head>
<body>
	<div th:replace="~{fragments/site/header}"></div>

	<main>
		<h1 th:text="${PageName}">Van maintenance</h1>

		<p style="margin-top:0;">
			What the van needs, when it needs it, and what has been done.
		</p>

		<h3 class="gl-heading">Actual maintenance</h3>
		<div th:replace="~{fragments/block/maintenance-actual}"></div>

		<div th:replace="~{fragments/block/note-list}"></div>

	</main>

	<div th:replace="~{fragments/site/footer}"></div>
</body>
</html>
