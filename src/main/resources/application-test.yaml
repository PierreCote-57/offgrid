#
# Server running on FullHost
#

# Static resources are edited while the app is running, so the browser must never keep a
# copy: an edited stylesheet has to be the one that renders on the next request.
spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-store: false
  thymeleaf:
    cache: false
  jackson:
    serialization:
      indent-output: true
# To read secrets (e.g. Claude API key)
  config:
    import: "optional:file:${folder.local}/config/secrets.properties"

BaseWebProcessor:
  siteName: "Going offgrid"

PageStateFilter:
  pageStateList: "external,draft,production"

folder:
  local: "/home/jelastic/offgrid"

server:
  port: 8080
  publicProtocol: "https"
  publicHostName: "offgrid.ca-west.oncoregrid.ca"
  publicPort: 443
# The reason on a thrown ResponseStatusException reaches error.html only when the request
# carries message=true, so a visitor never reads one and a diagnosis still can.
  error:
    include-message: on-param
