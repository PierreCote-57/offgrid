# Builds the jar and publishes it as a GitHub pre-release, so FullHost can deploy it by URL.
# Run by hand: Actions → Offgrid Build+pre-Release → Run workflow, or gh workflow run build-release.yml
name: Offgrid Build+pre-Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw -B package

      # The pom's finalName, og-<version>-<yyyyMMdd-HHmmss> (UTC), names the jar, the tag and the title.
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jarPath=$(ls target/*.jar)
          releaseName=$(basename "$jarPath" .jar)
          gh release create "$releaseName" "$jarPath" --target "$GITHUB_SHA" --title "$releaseName" --prerelease --notes "Built from $GITHUB_SHA"
