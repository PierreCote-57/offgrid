# Builds the jar and publishes it as a GitHub pre-release, so FullHost can deploy it by URL.
# Run by hand: Actions → Offgrid Build+pre-Release → Run workflow, or gh workflow run build-release.yml
name: Offgrid Build+pre-Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw -B package

      # Release name og-<version>-<yyyyMMdd-HHmm> (UTC), short enough for GitHub's lists. It is both
      # the tag and the title; the jar keeps the pom's full finalName.
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jarPath=$(ls target/*.jar)
          version=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml)
          buildMinute=$(basename "$jarPath" | sed -E 's/.*-([0-9]{8})-([0-9]{4})[0-9]{2}\.jar$/\1-\2/')
          releaseName="og-$version-$buildMinute"
          gh release create "$releaseName" "$jarPath" --target "$GITHUB_SHA" --title "$releaseName" --prerelease --notes "Built from $GITHUB_SHA"
